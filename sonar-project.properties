# Unique key for the project in SonarQube
sonar.projectKey=flutter-base-app

# Display name of the project in SonarQube UIs
sonar.projectName=flutter-base-app

# Current version of the project
sonar.projectVersion=1.0

# Source file encoding
sonar.sourceEncoding=UTF-8

# Main Dart source files
sonar.sources=lib

# Test directories
sonar.tests=test,integration_test

# Include only Dart test files
sonar.test.inclusions=**/*_test.dart

# Exclude generated, platform, and build artifacts from analysis
sonar.exclusions=\
**/.dart_tool/**,\
**/build/**,\
**/.idea/**,\
**/.vscode/**,\
**/android/**,\
**/ios/**,\
**/linux/**,\
**/macos/**,\
**/windows/**,\
**/web/**,\
**/coverage/**,\
lib/l10n/app_localizations*.dart

# Flutter/Dart coverage report generated by `flutter test --coverage`
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclude generated localization files and non-business constants from coverage
sonar.coverage.exclusions=\
lib/l10n/app_localizations*.dart,\
lib/app/theme/color_palette.dart,\
lib/app/theme/app_layout.dart,\
lib/app/routes/app_routes.dart

# Block the pipeline until the quality gate status is known
sonar.qualitygate.wait=true
