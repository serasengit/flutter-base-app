name: flutter_base_app

# Application description
description: "Base Flutter application template."

# Prevent accidental publication to pub.dev
publish_to: "none"

# Application version:
# format => major.minor.patch+build
#
# Examples:
# 1.0.0+1
# 1.2.5+12
#
# Android:
# - build-name   => versionName
# - build-number => versionCode
#
# iOS:
# - build-name   => CFBundleShortVersionString
# - build-number => CFBundleVersion
#
# Windows:
# - build-name used for product/file version
version: 1.0.0+1

environment:
  # Supported Dart SDK version
  sdk: ^3.11.5

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter

  # Flutter internationalization/localization support
  flutter_localizations:
    sdk: flutter

  # Internationalization and localization utilities
  # Used for translations, date formatting and locale management
  intl: ^0.20.2

  # Cupertino (iOS style) icon pack
  cupertino_icons: ^1.0.8

  # Environment variables support
  # Loads configuration values from `.env` file
  flutter_dotenv: ^6.0.1

  # HTTP client for REST API communication
  http: ^1.5.0

  # HTTP request and response interception
  # Commonly used for:
  # - Authentication headers
  # - Logging
  # - Error handling
  # - Token refresh
  http_interceptor: ^2.0.0

  # Global loading overlay widget
  # Useful for displaying loading states during async operations
  loader_overlay: ^5.0.0

  # Persistent local key-value storage
  # Commonly used for:
  # - User preferences
  # - App settings
  shared_preferences: ^2.5.5

  # Secure storage for sensitive values such as auth tokens
  flutter_secure_storage: ^9.2.4

  # Application logger
  # Provides formatted console logging utilities
  logger: ^2.7.0

  # Dependency injection / service locator
  # Used to register and retrieve shared dependencies
  # such as repositories, services and blocs
  get_it: ^9.2.1

  # Reads application version and build metadata from the platform package
  package_info_plus: ^8.3.1

  # Flutter integration for Bloc state management
  # Provides:
  # - BlocProvider
  # - BlocBuilder
  # - BlocListener
  # - BlocConsumer
  flutter_bloc: ^9.1.1

  # Simplifies object equality comparison
  # Commonly used in Bloc states and events
  equatable: ^2.0.8

  # Core Bloc library
  # Provides:
  # - Bloc
  # - Cubit
  # - Events
  # - State management
  bloc: ^9.2.1

dev_dependencies:
  # Flutter testing framework
  flutter_test:
    sdk: flutter

  # Flutter integration testing support
  integration_test:
    sdk: flutter

  # Recommended Flutter lint rules
  # Helps maintain code quality and consistency
  flutter_lints: ^6.0.0

flutter:
  # Enable Material Design icons
  uses-material-design: true

  # Enable Flutter localization code generation
  generate: true

  # Application assets
  assets:
    # Environment variables file
    - .env

  # Example assets structure:
  #
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #
  # Example fonts structure:
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
